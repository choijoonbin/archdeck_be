name: archdeck

# PostgreSQL service for the Spring Boot application. The application runs
# separately and receives connection credentials through its process environment.
services:
  db:
    image: ${ARCHDECK_POSTGRES_IMAGE:-postgres:17.12-bookworm}
    environment:
      POSTGRES_DB: ${ARCHDECK_DB_NAME:-archdeck}
      POSTGRES_USER: ${ARCHDECK_DB_USER:-archdeck_owner}
      POSTGRES_PASSWORD: ${ARCHDECK_DB_PASSWORD:?Set ARCHDECK_DB_PASSWORD in a local .env file}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
      TZ: UTC
    ports:
      - "127.0.0.1:${ARCHDECK_DB_PORT:-55433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema/001-initial.sql:/docker-entrypoint-initdb.d/001-initial.sql:ro
      - ./db/seed/010-taxonomy.sql:/docker-entrypoint-initdb.d/010-taxonomy.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  pgdata:
