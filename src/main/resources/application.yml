server:
  address: ${ARCHDECK_BIND_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:4000}
  servlet:
    session:
      timeout: 30m
      cookie:
        name: ${ARCHDECK_SESSION_COOKIE_NAME:ArchDeckSession}
        http-only: true
        secure: ${ARCHDECK_SECURE_COOKIE:false}
        same-site: lax
spring:
  datasource:
    url: ${ARCHDECK_JDBC_URL:jdbc:postgresql://127.0.0.1:55433/archdeck?currentSchema=archdeck,public}
    username: ${ARCHDECK_DB_USER:archdeck_owner}
    password: ${ARCHDECK_DB_PASSWORD}
  flyway:
    default-schema: archdeck
    schemas: archdeck
    baseline-on-migrate: true
    baseline-version: 1
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
      table-name: archdeck.SPRING_SESSION
  jackson:
    deserialization:
      fail-on-unknown-properties: true
