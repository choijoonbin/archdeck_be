server:
  port: 4000

spring:
  application:
    name: archdeck-backend
  datasource:
    url: jdbc:h2:file:./data/archdeckdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    io.archdeck: INFO
    org.springframework.web: INFO
